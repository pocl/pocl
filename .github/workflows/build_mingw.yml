---
name: Windows / MinGW / CPU tests

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
      - 'release*'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'CHANGES'
      - 'COPYING'
      - 'CREDITS'
      - 'LICENSE'
      - 'README.*'
      - 'tools/docker/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  mingw_test_matrix:
    name: ${{ matrix.msystem }} - CPU - shared libs:${{ matrix.shared_libs }}
    runs-on: ${{ matrix.msystem == 'CLANGARM64' && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        shared_libs: ['ON', 'OFF']
        msystem: [MINGW64, UCRT64, CLANG64, CLANGARM64]

    steps:
      - name: Checkout PoCL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            cc:p
            cmake:p
            hwloc:p
            libjpeg-turbo:p
            clang:p
            clang-tools-extra:p
            llvm:p
            spirv-llvm-translator:p
            python:p

      - name: Load Env vars
        run: cat .github/variables.txt >> "$GITHUB_ENV"

      - name: Configure PoCL
        run: |
          BUILD_FLAGS="-O2 -Wall -Wextra -Wno-unused-parameter -Wno-unused-variable"
          cmake -S . -B build-pocl \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_C_FLAGS_RELEASE=${BUILD_FLAGS}"  "-DCMAKE_CXX_FLAGS_RELEASE=${BUILD_FLAGS}" \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-pocl" \
            -DBUILD_SHARED_LIBS=${{ matrix.shared_libs }} \
            -DENABLE_ICD=OFF \
            -DENABLE_SPIRV=ON \
            -DKERNELLIB_HOST_CPU_VARIANTS=distro \
            -DENABLE_LLVM_FILECHECKS=0 \
            -DENABLE_LOADABLE_DRIVERS=${{ matrix.shared_libs }} \
            -G "Ninja"
        # XXX: ENABLE_ICD=OFF because ocl-icd doesn't support Windows,
        #      and PoCL's tests do not support Khronos' ICD loader

      - name: Build PoCL
        run: cmake --build build-pocl --target install

      - name: Run Tests
        env:
          POCL_CACHE_DIR: "${{ runner.temp }}/GH_POCL_CACHE"
        timeout-minutes: 120
        working-directory: build-pocl
        run: ../tools/scripts/run_cpu_tests $CTEST_FLAGS -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 'PoCL-${{ matrix.msystem }}-LLVM_MSYS2-shared_${{ matrix.shared_libs }}-${{ github.sha }}'
          path: '${{ github.workspace }}/install-pocl'
          if-no-files-found: error
          compression-level: 4
          archive: true
